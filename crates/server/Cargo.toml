[package]
name = "refstore-server"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "refstore-server"
path = "src/bin.rs"

[dependencies]
refstore-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
askama = "0.12"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
