<!DOCTYPE html>
<html lang='{{ lang }}'>
<head>
<meta charset='utf-8'><title>{{ i18n.heading_groups }} - Refstore</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 2rem; background: #f8f9fa; }
h1 { color: #333; }
.group { background: white; padding: 10px 16px; border-radius: 6px; margin: 4px 0; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
a { color: #4a6fa5; text-decoration: none; }
.nav { margin-bottom: 1rem; display: flex; align-items: center; }
.nav a { margin-right: 1rem; }
.lang-toggle { font-size: .85em; opacity: .7; border: 1px solid #ccc; padding: 2px 8px; border-radius: 4px; }
</style>
</head><body>
<div class='nav'>
<a href='/'>{{ i18n.link_back_short }}</a>
<a href='{{ i18n.nav_lang_url }}' class='lang-toggle'>{{ i18n.nav_lang_label }}</a>
</div>
<h1>{{ i18n.heading_groups }}</h1>
{% for group in groups %}
<div class='group'>{{ group.0.name }} ({{ group.1 }} {{ i18n.group_papers_suffix }})</div>
{% endfor %}
</body></html>
